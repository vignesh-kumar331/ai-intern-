<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Intelligence</title><style>body{font:15px system-ui;margin:0;background:#0b1220;color:#eef;padding:24px}.wrap{max-width:1100px;margin:auto}.card{background:#121c2e;border:1px solid #2a3952;border-radius:16px;padding:20px;margin:16px 0}input{width:70%;padding:12px;border-radius:10px;border:1px solid #394b66;background:#0b1423;color:white}button{padding:12px 18px;border:0;border-radius:10px;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #2a3952;text-align:left}.chips button{margin:5px;background:#20314a;color:#dce8f5}</style></head><body><div class="wrap"><h1>AI Support Ticket Intelligence</h1><p>Natural-language analytics and anomaly detection.</p><div class="card"><h2>Ask the data</h2><input id="q" placeholder="How many tickets are currently open?"><button onclick="ask()">Ask</button><div class="chips"><button onclick="q.value=this.textContent">How many tickets are currently open?</button><button onclick="q.value=this.textContent">Which agent resolved the most tickets?</button><button onclick="q.value=this.textContent">Show me all Critical tickets not resolved within 12 hours.</button><button onclick="q.value=this.textContent">What is the average customer rating for Technical category tickets?</button></div><p id="answer">Ready.</p><pre id="plan"></pre></div><div class="card"><h2>Dataset</h2><div id="stats">Loading…</div></div><div class="card"><h2>Anomalies</h2><div id="anom">Loading…</div></div><div class="card"><h2>Results</h2><div id="rows"></div></div></div><script>const $=id=>document.getElementById(id);async function j(u,o){let r=await fetch(u,o);let x=await r.json();if(!r.ok)throw Error(x.detail||r.statusText);return x}async function load(){try{let h=await j('/api/health');$('stats').textContent=`${h.rows} tickets · Ollama ${h.llm_available?'ready':'fallback'}`;let a=await j('/api/anomalies');$('anom').textContent=`${a.summary.total_anomalies} flagged: ${a.summary.long_resolution_count} long-resolution, ${a.summary.stale_high_priority_count} stale high-priority.`}catch(e){$('stats').textContent=e.message}}async function ask(){try{let x=await j('/api/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('q').value})});$('answer').textContent=x.answer;$('plan').textContent=JSON.stringify(x.plan,null,2);if(x.rows.length){let c=Object.keys(x.rows[0]);$('rows').innerHTML='<table><tr>'+c.map(v=>`<th>${v}</th>`).join('')+'</tr>'+x.rows.map(r=>'<tr>'+c.map(v=>`<td>${r[v]??''}</td>`).join('')+'</tr>').join('')+'</table>'}else $('rows').textContent='No rows returned.'}catch(e){$('answer').textContent=e.message}}load()</script></body></html>
